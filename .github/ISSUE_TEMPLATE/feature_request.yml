name: 功能建议
description: 分享你的需求或不顺手的地方
title: "[建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "欢迎提出意见！我会结合实际场景逐步改进。"
  - type: textarea
    id: scenario
    attributes:
      label: 你的使用场景
      description: 你在做什么？目前哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考或补充
      description: 可选：其他工具的做法、示例或草图。
